<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Taekwondo Highlights — Aniruddh Alexander Kumar</title>
  <style>
    :root {
      color-scheme: light;
      font-family: "DM Sans", sans-serif;
      color: #171b20;
      background: #fff;
    }

    * { box-sizing: border-box; }
    body { margin: 0; }
    header, main { width: min(1120px, calc(100% - 40px)); margin-inline: auto; }
    header { padding: 28px 0; }
    header a { color: #456b9a; font-size: .9rem; font-weight: 600; text-decoration: none; }
    main { padding: 38px 0 72px; }
    h1 { margin: 0 0 30px; font-size: clamp(2rem, 5vw, 3.2rem); letter-spacing: -.04em; }
    .highlights { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 320px), 1fr)); gap: 20px; }
    figure { min-width: 0; margin: 0; overflow: hidden; border: 1px solid #e6e9ed; border-radius: 14px; background: #f7f8fa; }
    video { display: block; width: 100%; aspect-ratio: 16 / 9; background: #111; object-fit: contain; }
    figcaption { padding: 14px 16px; font-size: .9rem; font-weight: 600; }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; }
    }
  </style>
</head>
<body>
  <header><a href="index.html#sports">← Back to portfolio</a></header>
  <main>
    <h1>Taekwondo Highlights</h1>
    <section class="highlights" aria-label="Taekwondo video highlights">
      <figure>
        <video controls preload="metadata" playsinline aria-label="Taekwondo highlight 1">
          <source src="assets/taekwondo/highlight-01.mp4" type="video/mp4" />
        </video>
        <figcaption>Training Footage</figcaption>
      </figure>
      <figure>
        <video controls preload="metadata" playsinline aria-label="Taekwondo highlight 2">
          <source src="assets/taekwondo/highlight-02.mp4" type="video/mp4" />
        </video>
        <figcaption>ISSO National Taekwondo Championship (Bronze)</figcaption>
      </figure>
      <figure>
        <video controls preload="metadata" playsinline aria-label="Taekwondo highlight 3">
          <source src="assets/taekwondo/highlight-03.mp4" type="video/mp4" />
        </video>
        <figcaption>Training Footage</figcaption>
      </figure>
      <figure>
        <video controls preload="metadata" playsinline aria-label="Taekwondo highlight 4">
          <source src="assets/taekwondo/highlight-04.mp4" type="video/mp4" />
        </video>
        <figcaption>ZP Taekwondo Cup (Bronze)</figcaption>
      </figure>
      <figure>
        <video controls preload="metadata" playsinline aria-label="Taekwondo highlight 5">
          <source src="assets/taekwondo/highlight-05.mp4" type="video/mp4" />
        </video>
        <figcaption>vs International Youth Player - Mohammad Adnan</figcaption>
      </figure>
    </section>
  </main>
</body>
</html>
